---
# Deployment

# Container image. Supports two formats:
#   1. Object (recommended):
#      image:
#        repository: docker.n8n.io/n8nio/n8n
#        tag: "1.94.0"        # empty = uses Chart.appVersion
#        pullPolicy: Always
#   2. String (legacy, full image reference):
#      image: "docker.n8n.io/n8nio/n8n:1.94.0"
#
# Common repositories / channels:
#   - docker.n8n.io/n8nio/n8n            standard build
#   - docker.n8n.io/n8nio/n8n:next       preview channel
#   - docker.n8n.io/n8nio/n8n:latest     rolling latest
#   - docker.n8n.io/n8nio/n8n:1.94.0     pinned version
image:
  repository: docker.n8n.io/n8nio/n8n
  # Default "latest". Pin to a specific version in production (e.g. "1.94.0").
  # Empty falls back to Chart.appVersion.
  tag: "latest"
  pullPolicy: Always

replicas: 1
# Legacy top-level imagePullPolicy still honored if set; prefer image.pullPolicy.
imagePullPolicy: null
envFromSecret: null

# Container command / args override.
# - command as string → wrapped in `sh -c "..."` (replaces ENTRYPOINT with a shell)
# - command as list   → passed as raw K8s command (replaces ENTRYPOINT, no shell)
# - args              → passed as K8s args (keeps ENTRYPOINT, overrides only CMD)
# n8n image has a proper ENTRYPOINT — prefer `args:` if you only need to change CMD.
# Example:
#   args: ["start", "--tunnel"]
command: null
args: null

# Pod-level securityContext (fsGroup / runAsUser / runAsGroup / runAsNonRoot / ...).
# n8n runs as uid 1000 (node) inside the image. When persistence is enabled on a
# block-storage CSI (DO / AWS EBS / GCP PD), the freshly-provisioned PVC is mounted
# as root:root — set `fsGroup: 1000` here so the kubelet chowns it at mount time
# and n8n can write. Empty map = no securityContext set on the pod.
# Example:
#   podSecurityContext:
#     fsGroup: 1000
#     runAsUser: 1000
#     runAsGroup: 1000
#     runAsNonRoot: true
podSecurityContext: {}

# Container-level securityContext for the n8n container.
# Example (Pod Security Standard "restricted" baseline):
#   securityContext:
#     allowPrivilegeEscalation: false
#     readOnlyRootFilesystem: false     # n8n writes to /home/node/.n8n
#     capabilities:
#       drop: [ALL]
securityContext: {}

# Deployment strategy (optional). When persistence is enabled and this is
# unset, defaults to Recreate to avoid ReadWriteOnce attach conflicts during
# rolling updates. Set explicitly to override.
# Example:
#   strategy:
#     type: RollingUpdate
strategy: null

# Persistence for /home/node/.n8n (workflows, credentials, SQLite DB, encryption key)
# n8n stores critical data here even when using external Postgres/MySQL.
# For production always enable persistence.
persistence:
  enabled: false
  # Use existing PVC instead of creating a new one
  existingClaim: null
  # PVC size (ignored when existingClaim is set)
  size: 10Gi
  # Access modes (ignored when existingClaim is set)
  accessModes: [ReadWriteOnce]
  # StorageClass (ignored when existingClaim is set). Empty = cluster default.
  storageClassName: null
  # Mount path inside the container
  mountPath: /home/node/.n8n
  # Extra annotations on the created PVC
  annotations: {}

# Ingress
ingress:
  enabled: false
  host: ''
  tls: true
  issueCertificate: true
  clusterIssuer: 'letsencrypt'
  tlsSecretName: ''
  whitelistSourceRange: null # Allow all IPs, adjust as necessary
