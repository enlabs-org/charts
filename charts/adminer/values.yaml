---
# Deployment
image:
  repository: adminer
  # Empty = Chart.appVersion (pinned). Legacy string form (image: 'repo:tag') still works.
  tag: ''
replicas: 1
imagePullPolicy: 'Always'


# Ingress
ingress:
  enabled: false
  host: ''
  tls: true
  issueCertificate: true
  clusterIssuer: 'letsencrypt'
  tlsSecretName: ''
  whitelistSourceRange: null # Allow all IPs, adjust as necessary
