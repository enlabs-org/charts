---
# Deployment
useDefaultDeployment: true
image: ''
replicas: 1
containerPort: 80
livenessProbePath: '/'
restartAfterRedeploy: false
envFromSecret: null
sideContainers: []
initContainers: []
env: null
useDatabaseCert: false
databaseCert: null

# Service
useDefaultService: true

# Ingress
useDefaultIngress: true
host: ''
wwwRedirect: false
tls: true
issueCertificate: true
clusterIssuer: 'letsencrypt'
tlsSecretName: ''
basicAuth: false
# Comma-separated CIDRs; when set, nginx answers 403 to any other source IP (applies to the main
# ingress and every side-container ingress).
whitelistSourceRange: ''
fcgi: false
fcgi_script_filename: ''

# Jobs
jobs: []

# CronJobs
cronJobs: []
