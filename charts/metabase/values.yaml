---
# Deployment
image:
  repository: metabase/metabase
  # Empty = Chart.appVersion (pinned). Legacy string form (image: 'repo:tag') still works.
  tag: ''
replicas: 1
imagePullPolicy: 'Always'
database:
  type: 'h2'
  host: ''
  port: ''
  name: ''
  user: ''
  password: ''


# Ingress
ingress:
  enabled: false
  host: ''
  tls: true
  issueCertificate: true
  clusterIssuer: 'letsencrypt'
  tlsSecretName: ''
