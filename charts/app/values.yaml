---
# =============================================================================
# GLOBAL SETTINGS
# =============================================================================
# These settings apply to all components unless overridden

global:
  # Default image for all components (can be overridden per component)
  image: null

  # Default host for ingress (can be overridden per component)
  host: null

  # Default ingress class name (can be overridden per component via ingress.className)
  ingressClassName: nginx

  # Image pull policy for all containers
  imagePullPolicy: Always

  # Custom labels applied to all resources
  # Example:
  #   labels:
  #     app.example.com/environment: "staging"
  #     app.example.com/team: "platform"
  labels: {}

  # Default environment secret (can be overridden per component)
  envFromSecret: null

  # Database certificate configuration
  useDatabaseCert: false
  databaseCert:
    mountPath: "/etc/ssl/certs"
    secretName: "database-cert"

  # Timezone for CronJobs (e.g. "Europe/Prague", "UTC")
  # See: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/#time-zones
  timezone: null

  # Restart all pods on every deployment (adds random annotation)
  restartAfterRedeploy: false

  # Affinity rules for pod scheduling
  # Applied globally to all components unless overridden
  affinity:
    # Node affinity - target specific nodes
    nodeAffinity:
      # Preferred node labels (soft constraint)
      # Example: preferredNodeLabels: {disktype: ssd, region: us-west-2}
      preferredNodeLabels: {}
      # Required node labels (hard constraint)
      # Example: requiredNodeLabels: {accelerator: gpu}
      requiredNodeLabels: {}
      # Full Kubernetes nodeAffinity syntax (overrides shortcuts)
      custom: {}

    # Pod anti-affinity - keep pods apart
    podAntiAffinity:
      # Spread pods across topology domains (soft constraint)
      # Example: preferredSpreadBy: ["kubernetes.io/hostname"]
      preferredSpreadBy: []
      # Spread pods across topology domains (hard constraint)
      # Example: requiredSpreadBy: ["topology.kubernetes.io/zone"]
      requiredSpreadBy: []
      # Avoid pods from other components
      # Example: avoidComponents: ["heavy-worker", "ml-processor"]
      avoidComponents: []
      # Full Kubernetes podAntiAffinity syntax (overrides shortcuts)
      custom: {}

    # Pod affinity - keep pods together
    podAffinity:
      # Prefer colocation with specific components
      # Example: preferComponents: ["cache", "database-proxy"]
      preferComponents: []
      # Require colocation with specific components
      # Example: requireComponents: ["cache"]
      requireComponents: []
      # Full Kubernetes podAffinity syntax (overrides shortcuts)
      custom: {}

# =============================================================================
# COMPONENTS
# =============================================================================
# Each component creates one Deployment + auto Service + optional Ingress
# Key = component name (used in resource naming)
#
# Service is auto-created when containerPort or ingress.enabled is defined.
# Use service.enabled: false to explicitly disable.
#
# Example:
#   components:
#     web:
#       enabled: true
#       image: "myapp-web:latest"
#       replicas: 2
#       containerPort: 80
#       command: null
#       labels:
#         app.example.com/scaling: "enabled"
#         app.example.com/shutdown-outside-hours: "true"
#       resources:
#         requests:
#           cpu: "100m"
#           memory: "128Mi"
#         limits:
#           cpu: "500m"
#           memory: "512Mi"
#       livenessProbe:
#         enabled: true
#         path: "/"
#         initialDelaySeconds: 10
#         periodSeconds: 10
#       readinessProbe:
#         enabled: false
#         path: "/"
#         initialDelaySeconds: 5
#         periodSeconds: 5
#       envFromSecret: null
#       env: []
#       service:                       # auto-created, optional config
#         type: ClusterIP
#         port: 80
#       ingress:
#         enabled: true
#         host: "example.com"
#         className: ""               # override global.ingressClassName
#         path: "/"                    # default: "/"
#         pathType: Prefix             # default: "Prefix"
#         tls:                         # TLS is enabled by default
#           enabled: false             # set to false to disable TLS
#           secretName: ""             # auto-generated if empty
#           issuer: "letsencrypt"      # default: "letsencrypt"
#         wwwRedirect: false
#         basicAuth:
#           enabled: false
#           username: ""
#           password: ""
#         fcgi:
#           enabled: false
#           scriptFilename: ""
#         proxyBodySize: ""
#         whitelistSourceRange: ""
#         securityPathFilter:
#           enabled: false
#           blockedPaths:
#             - "/.git"
#             - "/.env"
#             - "/.claude"
#       pdb:
#         enabled: false
#         minAvailable: 1
#       strategy:
#         type: RollingUpdate
#         rollingUpdate:
#           maxUnavailable: 1
#           maxSurge: 0
#       affinity:                    # overrides global affinity
#         podAntiAffinity:
#           requiredSpreadBy: ["kubernetes.io/hostname"]
#       initContainers: []
#       additionalContainers: []
#       persistence:                 # list of volumes to mount
#         - name: cache              # auto-created PVC: {release}-{component}-cache
#           size: 5Gi
#           accessModes: [ReadWriteOnce]
#           storageClassName: gp3
#           mountPath: /var/cache
#         - name: uploads
#           existingClaim: shared-uploads   # reference chart-level or external PVC
#           mountPath: /var/www/uploads
#           readOnly: false
#
#     worker:
#       enabled: true
#       image: "myapp-worker:latest"
#       replicas: 5
#       command: "php artisan queue:work"

components: {}

# =============================================================================
# JOBS
# =============================================================================
# One-time jobs defined at chart level
#
# Example:
#   jobs:
#     - name: db-migrate
#       image: "myapp-web:latest"
#       command: "php artisan migrate --force"
#       envFromSecret: null
#       env: []
#       restartPolicy: Never
#       backoffLimit: 3
#       resources:
#         requests:
#           cpu: "100m"
#           memory: "128Mi"

jobs: []

# =============================================================================
# CRONJOBS
# =============================================================================
# Scheduled jobs defined at chart level
#
# Example:
#   cronJobs:
#     - name: cleanup
#       schedule: "0 2 * * *"
#       image: "myapp-worker:latest"
#       command: "php artisan cleanup"
#       envFromSecret: null
#       env: []
#       restartPolicy: OnFailure
#       backoffLimit: 3
#       concurrencyPolicy: Forbid
#       timezone: "UTC"                # override global.timezone
#       resources:
#         requests:
#           cpu: "50m"
#           memory: "64Mi"

cronJobs: []

# =============================================================================
# PERSISTENT VOLUMES (chart-level, static provisioning)
# =============================================================================
# Cluster-scoped PersistentVolumes. Use only when you need static provisioning
# (existing NFS export, pre-provisioned disk, hostPath for local dev).
# For most cases prefer dynamic provisioning via StorageClass on a PVC.
#
# Example - NFS export:
#   persistentVolumes:
#     - name: shared-nfs
#       capacity: 100Gi
#       accessModes: [ReadWriteMany]
#       storageClassName: ""            # empty = static, no dynamic provisioner
#       reclaimPolicy: Retain           # default: Retain
#       nfs:
#         server: nfs.example.com
#         path: /exports/shared
#
# Example - hostPath (local dev only):
#   persistentVolumes:
#     - name: local-data
#       capacity: 10Gi
#       accessModes: [ReadWriteOnce]
#       hostPath:
#         path: /data/local
#
# Example - fully custom source (CSI, iSCSI, etc):
#   persistentVolumes:
#     - name: csi-vol
#       capacity: 50Gi
#       accessModes: [ReadWriteOnce]
#       csi:
#         driver: ebs.csi.aws.com
#         volumeHandle: vol-abc123

persistentVolumes: []

# =============================================================================
# PERSISTENT VOLUME CLAIMS (chart-level, shared between components)
# =============================================================================
# Use for storage that multiple components need to share (RWX) or when you
# want a PVC that is decoupled from a single component's lifecycle.
# Reference from a component via `existingClaim: <name>`.
#
# Example - shared uploads directory across web and worker:
#   persistentVolumeClaims:
#     - name: shared-uploads
#       size: 20Gi
#       accessModes: [ReadWriteMany]
#       storageClassName: efs-sc
#
#   components:
#     web:
#       persistence:
#         - name: uploads
#           existingClaim: shared-uploads
#           mountPath: /var/www/uploads
#     worker:
#       persistence:
#         - name: uploads
#           existingClaim: shared-uploads
#           mountPath: /var/www/uploads
#
# Example - bind to a specific static PV:
#   persistentVolumeClaims:
#     - name: nfs-claim
#       size: 100Gi
#       accessModes: [ReadWriteMany]
#       storageClassName: ""            # must match the PV
#       volumeName: shared-nfs          # bind explicitly to PV `shared-nfs`

persistentVolumeClaims: []

# =============================================================================
# COMPONENT PERSISTENCE
# =============================================================================
# Component-level `persistence` is a list of volume mounts. Each entry either
# auto-creates a PVC (default) or references an existing one via `existingClaim`.
# Auto-created PVCs are named `{release}-{component}-{persistenceName}`.
#
# Example - per-component private storage (auto-created PVC):
#   components:
#     web:
#       persistence:
#         - name: cache
#           size: 5Gi
#           accessModes: [ReadWriteOnce]
#           storageClassName: gp3
#           mountPath: /var/cache
#
# Example - mount shared chart-level PVC:
#   components:
#     web:
#       persistence:
#         - name: uploads
#           existingClaim: shared-uploads
#           mountPath: /var/www/uploads
#
# Example - mount PVC that was created outside the chart:
#   components:
#     web:
#       persistence:
#         - name: legacy-data
#           existingClaim: pre-existing-pvc
#           mountPath: /data
#           readOnly: true
#           subPath: subdir
#
# Volumes are mounted into main container, initContainers, and additionalContainers.
