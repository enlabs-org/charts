{{- range .Values.cronJobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: cronjob-{{ .name }}
    {{- with include "app.customLabels" (dict "global" $.Values.global) }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  schedule: {{ required "cronJobs[].schedule is required" .schedule | quote }}
  {{- $timezone := .timezone | default $.Values.global.timezone }}
  {{- if $timezone }}
  timeZone: {{ $timezone | quote }}
  {{- end }}
  concurrencyPolicy: {{ .concurrencyPolicy | default "Forbid" }}
  jobTemplate:
    spec:
      backoffLimit: {{ .backoffLimit | default 3 }}
      template:
        spec:
          {{- with include "app.podSecurityContext" (dict "component" . "global" $.Values.global) }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          containers:
            {{- $cronJobImage := .image | default $.Values.global.image }}
            - name: {{ .name }}
              image: {{ required "cronJobs[].image or global.image is required" $cronJobImage }}
              imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
              {{- with include "app.securityContext" (dict "container" . "global" $.Values.global) }}
              securityContext:
                {{- . | nindent 16 }}
              {{- end }}
              {{- include "app.command" (required "cronJobs[].command is required" .command) | nindent 14 }}
              {{- with .args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- if .envFromSecret }}
              envFrom:
                - secretRef:
                    name: {{ .envFromSecret }}
              {{- end }}
              {{- if .env }}
              env:
                {{- toYaml .env | nindent 16 }}
              {{- end }}
              {{- if .resources }}
              resources:
                {{- toYaml .resources | nindent 16 }}
              {{- end }}
              {{- if $.Values.global.useDatabaseCert }}
              volumeMounts:
                {{- include "app.databaseCertVolumeMount" $.Values.global | nindent 16 }}
              {{- end }}
          restartPolicy: {{ .restartPolicy | default "OnFailure" }}
          {{- if $.Values.global.useDatabaseCert }}
          volumes:
            {{- include "app.databaseCertVolume" $.Values.global | nindent 12 }}
          {{- end }}
{{- end }}
