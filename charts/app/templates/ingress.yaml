{{- range $componentName, $component := .Values.components }}
{{- if ne ($component.enabled | default true) false }}
{{- if $component.ingress }}
{{- if $component.ingress.enabled }}
{{- $ingressHost := $component.ingress.host | default $.Values.global.host }}
{{- $isTraefik := include "app.isTraefik" (dict "className" $component.ingress.className "globalClassName" $.Values.global.ingressClassName) }}
{{- $publicName := include "app.componentPublicName" (dict "releaseName" $.Release.Name "componentName" $componentName "override" $component.fullnameOverride) }}
{{- $bodyBytes := "0" }}
{{- if $component.ingress.proxyBodySize }}
{{- $bodyBytes = include "app.sizeToBytes" $component.ingress.proxyBodySize }}
{{- end }}
{{- /* Traefik Middlewares attached to this Ingress, referenced as <namespace>-<name>@kubernetescrd */}}
{{- $middlewares := list }}
{{- if and $isTraefik $component.ingress.whitelistSourceRange }}
{{- $middlewares = append $middlewares (printf "%s-%s-ip-allowlist@kubernetescrd" $.Release.Namespace $publicName) }}
{{- end }}
{{- if and $isTraefik (ne $bodyBytes "0") }}
{{- $middlewares = append $middlewares (printf "%s-%s-body-size@kubernetescrd" $.Release.Namespace $publicName) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.componentPublicName" (dict "releaseName" $.Release.Name "componentName" $componentName "override" $component.fullnameOverride) }}
  labels:
    {{- include "app.componentLabels" (dict "root" $ "componentName" $componentName) | nindent 4 }}
    {{- with include "app.customLabels" (dict "global" $.Values.global "component" $component) }}
    {{- . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if $component.ingress.wwwRedirect }}
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    {{- end }}
    {{- $tlsEnabled := true }}
    {{- if $component.ingress.tls }}
    {{- if kindIs "bool" $component.ingress.tls.enabled }}
    {{- $tlsEnabled = $component.ingress.tls.enabled }}
    {{- end }}
    {{- end }}
    {{- if $tlsEnabled }}
    cert-manager.io/cluster-issuer: {{ ($component.ingress.tls).issuer | default "letsencrypt" }}
    {{- end }}
    {{- if $component.ingress.basicAuth }}
    {{- if $component.ingress.basicAuth.enabled }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ include "app.componentPublicName" (dict "releaseName" $.Release.Name "componentName" $componentName "override" $component.fullnameOverride) }}-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
    {{- end }}
    {{- end }}
    {{- if $component.ingress.fcgi }}
    {{- if $component.ingress.fcgi.enabled }}
    nginx.ingress.kubernetes.io/backend-protocol: "FCGI"
    nginx.ingress.kubernetes.io/fastcgi-index: "index.php"
    nginx.ingress.kubernetes.io/fastcgi-params-configmap: {{ include "app.componentPublicName" (dict "releaseName" $.Release.Name "componentName" $componentName "override" $component.fullnameOverride) }}-fcgi-cm
    {{- end }}
    {{- end }}
    {{- /* Request body limit: nginx annotation, or a Traefik buffering Middleware (see middleware-body-size.yaml) */}}
    {{- if and $component.ingress.proxyBodySize (not $isTraefik) }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $component.ingress.proxyBodySize | quote }}
    {{- end }}
    {{- /* IP Whitelist for VPN restriction: nginx annotation, or a Traefik allowlist Middleware */}}
    {{- if and $component.ingress.whitelistSourceRange (not $isTraefik) }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ $component.ingress.whitelistSourceRange | quote }}
    {{- end }}
    {{- if $middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $middlewares }}
    {{- end }}
spec:
  ingressClassName: {{ $component.ingress.className | default $.Values.global.ingressClassName | default "nginx" }}
  {{- if $tlsEnabled }}
  tls:
    - hosts:
        - {{ $ingressHost }}
        {{- if $component.ingress.wwwRedirect }}
        - www.{{ $ingressHost }}
        {{- end }}
        {{- range $component.ingress.extraHosts }}
        - {{ . }}
        {{- end }}
      {{- $customSecretName := "" }}
      {{- if $component.ingress.tls }}
      {{- $customSecretName = $component.ingress.tls.secretName }}
      {{- end }}
      {{- if $customSecretName }}
      secretName: {{ $customSecretName }}
      {{- else }}
      secretName: {{ include "app.componentPublicName" (dict "releaseName" $.Release.Name "componentName" $componentName "override" $component.fullnameOverride) }}-tls
      {{- end }}
  {{- end }}
  rules:
    - host: {{ required (printf "components.%s.ingress.host or global.host is required" $componentName) $ingressHost }}
      http:
        paths:
          - path: {{ $component.ingress.path | default "/" }}
            pathType: {{ $component.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "app.componentPublicName" (dict "releaseName" $.Release.Name "componentName" $componentName "override" $component.fullnameOverride) }}
                port:
                  name: http
    {{- range $component.ingress.extraHosts }}
    - host: {{ . }}
      http:
        paths:
          - path: {{ $component.ingress.path | default "/" }}
            pathType: {{ $component.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "app.componentPublicName" (dict "releaseName" $.Release.Name "componentName" $componentName "override" $component.fullnameOverride) }}
                port:
                  name: http
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
