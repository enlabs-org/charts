{{- range .Values.jobs }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Release.Name }}-{{ .name }}-{{ randAlphaNum 5 | lower }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: job-{{ .name }}
    {{- with include "app.customLabels" (dict "global" $.Values.global) }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .backoffLimit | default 3 }}
  template:
    spec:
      {{- with include "app.podSecurityContext" (dict "component" . "global" $.Values.global) }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        {{- $jobImage := .image | default $.Values.global.image }}
        - name: {{ .name }}
          image: {{ required "jobs[].image or global.image is required" $jobImage }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- with include "app.securityContext" (dict "container" . "global" $.Values.global) }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          {{- include "app.command" (required "jobs[].command is required" .command) | nindent 10 }}
          {{- with .args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .envFromSecret }}
          {{- end }}
          {{- if .env }}
          env:
            {{- toYaml .env | nindent 12 }}
          {{- end }}
          {{- if .resources }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- end }}
          {{- if $.Values.global.useDatabaseCert }}
          volumeMounts:
            {{- include "app.databaseCertVolumeMount" $.Values.global | nindent 12 }}
          {{- end }}
      restartPolicy: {{ .restartPolicy | default "Never" }}
      {{- if $.Values.global.useDatabaseCert }}
      volumes:
        {{- include "app.databaseCertVolume" $.Values.global | nindent 8 }}
      {{- end }}
{{- end }}
