name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test:
    name: Helm Chart Lint and Validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm-version: [v3.19.0, v4.0.0]
    env:
      # verze Kubernetes cílového clusteru (DOKS), podle ní kubeconform vybírá schémata
      KUBERNETES_VERSION: "1.33.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm ${{ matrix.helm-version }}
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm-version }}

      - name: Run Helm Lint
        run: make helm-lint

      - name: Run Helm Template
        run: make helm-template

      - name: Yaml Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .build
      
      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run kubeconform
        run: |
          # Traefik Middleware CRD nemá ve výchozím katalogu schéma, přeskakujeme ho explicitně
          # (ostatní chybějící schémata už selžou, nic se neignoruje potichu)
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" -skip Middleware .build
